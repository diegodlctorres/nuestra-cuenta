<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Nuestra Cuenta | Sin conexión</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Outfit, Inter, system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(99, 102, 241, 0.12), transparent 38%),
          linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      }
      main {
        width: min(100%, 28rem);
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        padding: 28px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #475569;
      }
      button {
        margin-top: 20px;
        width: 100%;
        border: 0;
        border-radius: 16px;
        background: #4f46e5;
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 14px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>La app sigue instalada, pero ahora mismo no hay red disponible. Revisa tu conexión y vuelve a intentar.</p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
