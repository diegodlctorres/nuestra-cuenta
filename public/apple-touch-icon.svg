<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo sólido sin transparencia (Requisito de Apple) -->
  <rect width="180" height="180" fill="#4F46E5"/>
  
  <!-- Icono de Nuestra Cuenta centrado -->
  <path 
    d="M90 42L135 76V132C135 134.982 133.815 137.842 131.704 139.953C129.593 142.064 126.733 143.25 123.75 143.25H56.25C53.2674 143.25 50.4075 142.064 48.2967 139.953C46.1859 137.842 45 134.982 45 132V76L90 42Z" 
    stroke="white" 
    stroke-width="10" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  <circle cx="90" cy="98" r="17" stroke="white" stroke-width="10"/>

  <!-- Sutil degradado de iluminación superior para estética iOS -->
  <rect width="180" height="180" fill="url(#apple_gradient)" style="mix-blend-mode:overlay"/>

  <defs>
    <linearGradient id="apple_gradient" x1="90" y1="0" x2="90" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.1"/>
      <stop offset="1" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
