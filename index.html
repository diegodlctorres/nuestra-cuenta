<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nuestra Cuenta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('nuestra-cuenta.theme');
          if (['default', 'oceanic', 'nature', 'sunset'].indexOf(theme) !== -1) {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (error) {
          // Use CSS defaults when storage is unavailable.
        }
      })();
    </script>
    <title>Nuestra Cuenta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
